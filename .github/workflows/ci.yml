# Typecheck en smoketest. Draait op elke pull request en op elke push naar main.
# De smoketest praat alleen met de lokale mailmock, nooit met een echte provider.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

  smoke:
    name: Smoketest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Faalt deze stap, dan start de smoketest niet en wordt geen formulier verstuurd.
      - name: Blokkade
        run: node scripts/blokkade-check.mjs

      # Playwright hoort niet bij de site. Alleen deze job installeert hem,
      # zonder package.json of het lockfile aan te passen.
      - name: Install browser
        run: |
          bun add --no-save playwright@1.63.0
          bunx playwright install --with-deps chromium

      # Tijdelijk alleen de CTA-controle, plus de blokkade-check hierboven.
      # De volledige smoketest gaat pas weer aan na de herreview van Klaas
      # en het ja van Joshua. Tot die tijd vult deze job geen formulier in.
      - name: Smoketest
        env:
          BASE: http://localhost:3000
          # Zonder deze lokale mock post de dev-server naar het echte FormSubmit.
          # De sleutel blijft leeg zodat Resend niet wordt aangeroepen.
          MO_LEAD_MAIL_ENDPOINT: http://localhost:3101/mail
          MO_RESEND_API_KEY: ""
        run: |
          set -euo pipefail
          node scripts/blokkade-check.mjs
          node --input-type=module -e "import { isLoopbackUrl } from './scripts/mail-blokkade.mjs'; const eindpunt = process.env.MO_LEAD_MAIL_ENDPOINT ?? ''; if (!isLoopbackUrl(eindpunt)) { console.error('MO_LEAD_MAIL_ENDPOINT is geen lokaal nepadres: ' + eindpunt); process.exit(1); } if (process.env.MO_RESEND_API_KEY) { console.error('MO_RESEND_API_KEY moet leeg zijn'); process.exit(1); }"
          node scripts/mock-endpoint.mjs > /tmp/mock-mail.log 2>&1 &
          bun run dev -- --host :: --port 3000 --strictPort > /tmp/dev-server.log 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "dev-server kwam niet op http://localhost:3000"
            cat /tmp/dev-server.log || true
            exit 1
          fi
          CHROMIUM_PATH="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          export CHROMIUM_PATH
          test -x "$CHROMIUM_PATH"
          # Volledige smoketest pas weer na de herreview van Klaas en het ja van Joshua.
          node scripts/smoke.mjs --alleen-cta
